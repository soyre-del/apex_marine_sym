name: webdev_b

services:
  webdev_b_mysql:
    image: mysql:8.0
    container_name: webdev_b_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:3306"
    volumes:
      - webdev_b_db_data:/var/lib/mysql
    networks:
      - webdev_b_network

  webdev_b_phpmyadmin:
    image: phpmyadmin
    container_name: webdev_b_phpmyadmin
    restart: unless-stopped
    depends_on:
      - webdev_b_mysql
    environment:
      PMA_HOST: webdev_b_mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "8082:80"
    networks:
      - webdev_b_network

volumes:
  webdev_b_db_data:
    name: webdev_b_db_data

networks:
  webdev_b_network:
    name: webdev_b_network
